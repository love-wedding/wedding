        fetch("./data.json")
        .then(res => res.json())
        .then(data => {
            renderCards(data.weddingCards, "weddingCards");
            renderCards(data.invitationCards, "invitationCards");
            renderCards(data.weddingVideos, "weddingVideos", true);
        })
        .catch(err => console.error("Load data.json lỗi:", err));


        /* ===== RENDER ===== */
        function renderCards(list, id, isVideo = false) {
            const box = document.getElementById(id);
            box.innerHTML = "";
            list.forEach(item => {
                const card = document.createElement("div");
                card.className = isVideo ? "card video-card" : "card";

                card.innerHTML = `
            <div class="thumb">
                ${item.tag ? `
                <div class="badge ${item.tag}">
                    ${item.tag === "best" ? "🔥 BEST SELLER" : "✨ NEW"}
                </div>` : ""}
                <img src="${item.image}">
            </div>
            <div class="info">
                <h3>${item.name}</h3>
                <div class="price">${item.price}</div>
            </div>
            <div class="btn">${isVideo ? "Xem video" : "Xem thiệp"}</div>
        `;

                if (isVideo) {
                    card.onclick = () => openVideo(item);
                } else {
                    card.onclick = () => window.open(item.url, "_blank");
                }

                box.appendChild(card);
            });
        }

        /* ===== TAB SWITCH ===== */
        document.querySelectorAll(".tab").forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".card-list").forEach(c => c.classList.remove("active"));

                tab.classList.add("active");
                document.getElementById(tab.dataset.tab).classList.add("active");
            };
        });

        /* ===== VIDEO CONTROL ===== */
        function openVideo(item) {
            const modal = document.getElementById("videoModal");
            const video = document.getElementById("videoPlayer");
            const youtube = document.getElementById("youtubePlayer");

            modal.classList.add("active");

            video.pause();
            video.src = "";
            youtube.src = "";
            video.style.display = "none";
            youtube.style.display = "none";

            if (item.type === "mp4") {
                video.src = item.video;
                video.style.display = "block";
                video.play();
            }

            if (item.type === "youtube") {
                youtube.src = item.video + "?autoplay=1";
                youtube.style.display = "block";
            }
        }

        function closeVideo() {
            const modal = document.getElementById("videoModal");
            const video = document.getElementById("videoPlayer");
            const youtube = document.getElementById("youtubePlayer");

            modal.classList.remove("active");
            video.pause();
            video.src = "";
            youtube.src = "";
        }

        document.getElementById("videoModal").onclick = function (e) {
            if (e.target.id === "videoModal") closeVideo();
        };
