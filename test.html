<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Container Inventory Socket</title>

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: Arial; padding: 20px }
        input { margin: 5px 0; width: 300px; padding: 6px }
        button { padding: 6px 12px; margin-right: 5px }
        pre { background: #111; color: #0f0; padding: 10px }
    </style>
</head>
<body>

<h2>Test WebSocket Container Inventory</h2>

<div>
    <input id="rfid" placeholder="Nhập RFID code">
</div>

<div>
    <input id="deviceId" placeholder="Nhập deviceId (tuỳ chọn)">
</div>

<div>
    <input id="inventoryId" placeholder="Nhập inventoryId">
</div>

<div>
    <button onclick="connect()">Connect</button>
    <button onclick="send()">Send RFID</button>
</div>

<pre id="log"></pre>

<script>
    let stompClient = null;

    function log(msg) {
        document.getElementById("log").textContent += msg + "\n";
    }

    function connect() {
        // const socket = new SockJS("https://api-pana.trackify.life/pav-ws");
        const socket = new SockJS("http://localhost:8080/pav-ws");
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, frame => {
            log("✅ Connected");
            stompClient.subscribe("/topic/securityGateLog/fc0336ac-0ccd-4069-bedb-40861f251e5e", msg => {
                log("📩 Response: " + msg.body);
            });
        }, err => {
            log("❌ Error: " + err);
        });
    }

    function send() {
        if (!stompClient || !stompClient.connected) {
            alert("Chưa connect socket");
            return;
        }

        const rfid = document.getElementById("rfid").value.trim();
        const deviceId = document.getElementById("deviceId").value.trim();
        const inventoryId = document.getElementById("inventoryId").value.trim();

        if (!rfid || !inventoryId) {
            alert("RFID và inventoryId là bắt buộc");
            return;
        }

        const payload = {
            rfidCode: rfid,
            deviceId: deviceId || null,
            inventoryId: Number(inventoryId)
        };

        stompClient.send(
            "/app/container_inventory",
            {},
            JSON.stringify(payload)
        );

        log("📤 Sent: " + JSON.stringify(payload));
    }
</script>

</body>
</html>
