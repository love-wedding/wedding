<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lễ Dạm Ngõ – Thuý Nga &amp; Ngô Huy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+SC:wght@900&family=Playfair+Display:ital,wght@0,700;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../fonts/names-fonts.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:wght@500;700&family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --g: #47763a;
            --bg: #14110d
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0b09
            }
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            overflow: hidden
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0)
        }

        #stage {
            position: relative;
            width: 1600px;
            height: 900px;
            flex: none;
            transform-origin: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse 38% 42% at 12% 12%, rgba(150, 215, 120, .55), transparent 70%),
                radial-gradient(ellipse 30% 35% at 28% 30%, rgba(190, 235, 160, .45), transparent 70%),
                radial-gradient(ellipse 35% 38% at 90% 88%, rgba(170, 225, 140, .5), transparent 72%),
                radial-gradient(ellipse 25% 30% at 62% 72%, rgba(190, 235, 165, .4), transparent 70%), #f6f9f3;
            animation: wash 14s ease-in-out infinite alternate
        }

        @keyframes wash {
            to {
                background-position: 14px 10px, -10px 8px, -12px -8px, 8px -6px, 0 0
            }
        }

        #paper {
            position: absolute;
            inset: 0;
            opacity: .5;
            mix-blend-mode: multiply;
            pointer-events: none
        }

        .abs {
            position: absolute
        }

        .rev {
            opacity: 0;
            filter: blur(18px);
            transform: translateY(14px) scale(.98);
            animation: rev 1.8s cubic-bezier(.2, .7, .2, 1) forwards
        }

        @keyframes rev {
            to {
                opacity: 1;
                filter: blur(0);
                transform: none
            }
        }

        #title {
            left: 0;
            width: 910px;
            top: 62px;
            text-align: center;
            font: 700 64px/1 'Playfair Display', Georgia, serif;
            color: var(--g);
            letter-spacing: 1px;
            animation-delay: .2s
        }

        #hy {
            left: 210px;
            top: 150px;
            width: 480px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 900 430px/1 'Noto Sans SC', 'Songti SC', serif;
            color: #4c7a3e;
            animation: stamp 1.7s cubic-bezier(.2, .8, .2, 1) .5s forwards, glow 5s ease-in-out 2.6s infinite;
            text-shadow: 0 0 0 #cfe3b8, 2px 3px 0 rgba(230, 240, 200, .7)
        }

        .n {
            font-family: 'Great Vibes', 'Alex Brush', cursive;
            color: #3e6a33;
            -webkit-text-stroke: .9px #3e6a33;
            white-space: nowrap;
            line-height: 1.1;
            text-shadow: 2px 3px 5px rgba(40, 70, 30, .16)
        }

        .ring {
            left: 210px;
            top: 150px;
            width: 480px;
            height: 480px;
            box-sizing: border-box;
            border-radius: 50%;
            border: 5px solid rgba(110, 170, 90, .55);
            opacity: 0;
            animation: ring 2s ease-out forwards
        }

        @keyframes ring {
            0% {
                opacity: .9;
                transform: scale(.55)
            }

            100% {
                opacity: 0;
                transform: scale(1.8)
            }
        }

        @keyframes stamp {
            0% {
                opacity: 0;
                transform: scale(2) rotate(-10deg);
                filter: blur(16px)
            }

            50% {
                opacity: 1;
                transform: scale(.92) rotate(1.5deg);
                filter: blur(0)
            }

            72% {
                transform: scale(1.04)
            }

            100% {
                opacity: 1;
                transform: none;
                filter: blur(0)
            }
        }

        @keyframes glow {
            50% {
                text-shadow: 0 0 34px rgba(150, 215, 110, .85), 2px 3px 0 rgba(230, 240, 200, .7)
            }
        }

        .nm {
            left: 800px;
            width: 800px;
            box-sizing: border-box;
            padding: 40px 30px;
            text-align: center;
            -webkit-mask-image: linear-gradient(90deg, #000 35%, transparent 65%);
            mask-image: linear-gradient(90deg, #000 35%, transparent 65%);
            -webkit-mask-size: 300% 100%;
            mask-size: 300% 100%
        }

        @keyframes write {
            0% {
                opacity: 0;
                filter: blur(6px);
                transform: none;
                -webkit-mask-position: 100% 0;
                mask-position: 100% 0
            }

            12% {
                opacity: 1
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: none;
                -webkit-mask-position: 0 0;
                mask-position: 0 0
            }
        }

        #n1 {
            top: 150px;
            font-size: 148px;
            animation: write 3s ease-in-out 1.6s forwards
        }

        #amp {
            left: 800px;
            width: 800px;
            text-align: center;
            top: 395px;
            font-size: 100px;
            -webkit-text-stroke: .5px #3e6a33;
            animation-delay: 1.7s
        }

        #n2 {
            top: 470px;
            font-size: 148px;
            animation: write 3s ease-in-out 3.8s forwards
        }

        #date {
            left: 850px;
            width: 670px;
            top: 782px;
            text-align: center;
            font: italic 500 42px/1 'Playfair Display', Georgia, serif;
            color: #2f4a2a;
            letter-spacing: 2px;
            animation-delay: 3s
        }

        #lotus {
            left: -6px;
            bottom: -4px;
            width: 470px;
            opacity: 0;
            animation: rev 2s ease-out 1.2s forwards;
            transform-origin: 20% 100%;
            filter: drop-shadow(0 6px 8px rgba(30, 60, 20, .18))
        }

        #df {
            right: 36px;
            top: 14px;
            width: 190px;
            animation: fly 9s ease-in-out infinite, fadein 2s 3.5s both
        }

        @keyframes fadein {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes fly {

            0%,
            100% {
                transform: translate(0, 0) rotate(-4deg)
            }

            30% {
                transform: translate(-18px, 14px) rotate(3deg)
            }

            60% {
                transform: translate(8px, 24px) rotate(-2deg)
            }
        }

        .w {
            transform-origin: 50% 50%;
            animation: flap .22s ease-in-out infinite alternate
        }

        .w.b {
            animation-delay: .07s
        }

        @keyframes flap {
            to {
                transform: scaleY(.82)
            }
        }
    </style>
</head>

<body>
    <div id="stage">
        <svg id="paper" width="100%" height="100%">
            <filter id="p">
                <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" seed="3" />
                <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .6  0 0 0 0 .5  0 0 0 .55 0" />
            </filter>
            <filter id="p2">
                <feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="3" seed="8" />
                <feColorMatrix values="0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 .55  0 0 0 .35 0" />
            </filter>
            <rect width="100%" height="100%" filter="url(#p)" />
            <rect width="100%" height="100%" filter="url(#p2)" />
        </svg>
        <div id="title" class="abs rev">LỄ DẠM NGÕ</div>
        <div class="abs ring" style="animation-delay:1.1s"></div>
        <div class="abs ring" style="animation-delay:1.6s"></div>
        <div id="hy" class="abs rev">囍</div>
        <canvas id="lotus" class="abs"></canvas>
        <div id="n1" class="abs n nm rev">Thuý Nga</div>
        <div id="amp" class="abs n rev">&amp;</div>
        <div id="n2" class="abs n nm rev">Ngô Huy</div>
        <div id="date" class="abs rev">14.09.2026</div>
        <svg id="df" class="abs" viewBox="0 0 120 150" fill="none">
            <g stroke="#4f9a82" stroke-width="1.2">
                <path d="M60 40 L60 135" stroke-width="3" stroke-linecap="round" />
                <circle cx="60" cy="34" r="6" fill="#5fae96" />
                <g class="w">
                    <path d="M58 52 C30 30 8 18 4 28 C10 42 38 54 58 58Z" fill="rgba(110,190,165,.55)" />
                    <path d="M62 52 C90 30 112 18 116 28 C110 42 82 54 62 58Z" fill="rgba(110,190,165,.55)" />
                </g>
                <g class="w b">
                    <path d="M58 62 C34 66 12 78 12 88 C26 92 48 76 58 68Z" fill="rgba(110,190,165,.5)" />
                    <path d="M62 62 C86 66 108 78 108 88 C94 92 72 76 62 68Z" fill="rgba(110,190,165,.5)" />
                </g>
                <path d="M60 70 L28 40 M60 70 L92 40" opacity=".5" />
            </g>
        </svg>
    </div>
    <script>
        const st = document.getElementById('stage');
        function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); st.style.transform = 'scale(' + s + ')' }
        addEventListener('resize', fit); fit();
        const cv = document.getElementById('lotus'), cx = cv.getContext('2d');
        const img = new Image();
        img.onload = () => {
            const W = cv.width = img.width, H = cv.height = img.height;
            const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
            function draw(ms) {
                const t = rm ? 0 : ms / 1000; cx.clearRect(0, 0, W, H);
                for (let y = 0; y < H; y += 2) {
                    const h = 1 - y / H, k = Math.pow(h, 1.7);
                    const dx = k * (26 * Math.sin(t * .9 + h * 1.6) + 9 * Math.sin(t * 1.9 + h * 4) + 6 * Math.sin(t * .5));
                    const dy = h > .45 ? Math.sin(t * 1.1 + h * 2) * 5 * (h - .45) : 0;
                    cx.drawImage(img, 0, y, W, 2, dx, y + dy, W, 2.5);
                }
                if (!rm) requestAnimationFrame(draw)
            }
            requestAnimationFrame(draw)
        };

                st(n1, d.namesFontSize, d.namesFontFamily, d.namesColor, d.namesPosY, d.namesPosX === undefined ? undefined : 800 + Number(d.namesPosX));

  <script>
    (function() {
      // Lắng nghe cập nhật dữ liệu
      window.addEventListener('message', e => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'UPDATE_BACKGROUND_DATA' || e.data.type === 'UPDATE_STAGE_DATA' || e.data.type === 'UPDATE_WEDDING_DATA') {
          const d = e.data.payload || {};
          window.__currentData = Object.assign({}, window.__currentData, d);
          if (d.groomName) { const n2 = document.getElementById('n2'); if (n2) n2.textContent = d.groomName; }
          if (d.brideName) { const n1 = document.getElementById('n1'); if (n1) n1.textContent = d.brideName; }
          if (d.weddingDate) { const dt = document.getElementById('date'); if (dt) dt.textContent = d.weddingDate; }
          if (d.title) { const tit = document.getElementById('title'); if (tit) tit.textContent = d.title; }
          if (d.namesFontSize) {
            document.querySelectorAll('.nm').forEach(el => el.style.fontSize = d.namesFontSize + 'px');
          }
          if (d.namesColor) {
            document.querySelectorAll('.nm, #amp').forEach(el => el.style.color = d.namesColor);
          }
        }
      });

      const exportCvs = document.createElement('canvas');
      const exportCtx = exportCvs.getContext('2d');

      const defaultData = {
        groomName: "Ngô Huy",
        brideName: "Thuý Nga",
        weddingDate: "14.09.2026",
        initial1: "囍",
        title: "LỄ DẠM NGÕ",
        namesFontSize: 148,
        namesFontFamily: "'Great Vibes', cursive",
        namesColor: "#3e6a33",
        monoFontSize: 430,
        monoColor: "#4c7a3e",
        dateFontSize: 42,
        dateColor: "#2f4a2a",
        titleFontSize: 64,
        titleColor: "#47763a"
      };

      function renderSceneToCanvas(t) {
        const W = exportCvs.width;
        const H = exportCvs.height;
        const s = W / 1600;
        const d = Object.assign({}, defaultData, window.__currentData || {});

        exportCtx.setTransform(1, 0, 0, 1, 0, 0);
        // 1. Nền giấy mỹ thuật màu xanh ngọc nhạt đặc (solid opaque)
        exportCtx.fillStyle = '#f2f7f3';
        exportCtx.fillRect(0, 0, W, H);

        // Vệt loang màu nước góc
        const gTR = exportCtx.createRadialGradient(W, 0, 0, W, 0, 0.45 * W);
        gTR.addColorStop(0, 'rgba(110, 190, 165, 0.35)');
        gTR.addColorStop(1, 'rgba(110, 190, 165, 0)');
        exportCtx.fillStyle = gTR;
        exportCtx.fillRect(0, 0, W, H);

        const gBL = exportCtx.createRadialGradient(0, H, 0, 0, H, 0.45 * W);
        gBL.addColorStop(0, 'rgba(110, 190, 165, 0.35)');
        gBL.addColorStop(1, 'rgba(110, 190, 165, 0)');
        exportCtx.fillStyle = gBL;
        exportCtx.fillRect(0, 0, W, H);

        exportCtx.save();
        exportCtx.scale(s, s);

        // 2. Vòng tròn nhẫn vàng & song hỷ
        exportCtx.strokeStyle = 'rgba(79, 154, 130, 0.25)';
        exportCtx.lineWidth = 2;
        exportCtx.beginPath();
        exportCtx.arc(800, 450, 260, 0, Math.PI * 2);
        exportCtx.stroke();
        exportCtx.beginPath();
        exportCtx.arc(800, 450, 310, 0, Math.PI * 2);
        exportCtx.stroke();

        // Chữ 囍 dấu ấn
        exportCtx.textAlign = 'center';
        exportCtx.textBaseline = 'middle';
        exportCtx.font = `900 ${d.monoFontSize || 430}px "Noto Sans SC", serif`;
        exportCtx.fillStyle = d.monoColor || 'rgba(76, 122, 62, 0.12)';
        exportCtx.fillText(d.initial1 || '囍', 800, 450);

        // 3. Hoa sen gợn sóng từ canvas lotus
        const cvLotus = document.getElementById('lotus');
        if (cvLotus && cvLotus.width) {
          exportCtx.drawImage(cvLotus, 800 - cvLotus.width / 2, 450 - cvLotus.height / 2);
        }

        // 4. Tiêu đề
        exportCtx.font = `600 ${d.titleFontSize || 64}px "Playfair Display", serif`;
        exportCtx.fillStyle = d.titleColor || '#47763a';
        exportCtx.fillText(d.title || 'LỄ DẠM NGÕ', 800, 120);

        // 5. Tên cô dâu & Chú rể
        exportCtx.font = `${d.namesFontSize || 148}px ${d.namesFontFamily || '"Great Vibes", cursive'}`;
        exportCtx.fillStyle = d.namesColor || '#3e6a33';
        exportCtx.fillText(d.brideName || 'Thuý Nga', 460, 470);
        exportCtx.font = `60px "Playfair Display", serif`;
        exportCtx.fillText('&', 800, 470);
        exportCtx.font = `${d.namesFontSize || 148}px ${d.namesFontFamily || '"Great Vibes", cursive'}`;
        exportCtx.fillText(d.groomName || 'Ngô Huy', 1140, 470);

        // 6. Ngày cưới
        exportCtx.font = `500 ${d.dateFontSize || 42}px "Playfair Display", serif`;
        exportCtx.fillStyle = d.dateColor || '#2f4a2a';
        exportCtx.fillText(d.weddingDate || '14.09.2026', 800, 800);

        // Chuồn chuồn bay lượn nhẹ
        const dfX = 1200 + Math.sin(t * 1.5) * 20;
        const dfY = 220 + Math.cos(t * 1.2) * 15;
        exportCtx.save();
        exportCtx.translate(dfX, dfY);
        exportCtx.rotate(Math.sin(t * 1.5) * 0.1);
        exportCtx.strokeStyle = '#4f9a82';
        exportCtx.lineWidth = 2;
        exportCtx.beginPath();
        exportCtx.moveTo(0, -20);
        exportCtx.lineTo(0, 30);
        exportCtx.stroke();
        exportCtx.fillStyle = 'rgba(110, 190, 165, 0.6)';
        exportCtx.beginPath();
        exportCtx.ellipse(-25, -5, 25, 8, -0.2, 0, Math.PI * 2);
        exportCtx.fill();
        exportCtx.beginPath();
        exportCtx.ellipse(25, -5, 25, 8, 0.2, 0, Math.PI * 2);
        exportCtx.fill();
        exportCtx.restore();

        exportCtx.restore();
      }

      BgVideoExport.init({
        canvas: exportCvs,
        duration: 15,
        fileName: 'dam-ngo-xanh-ngoc',
        render: t => renderSceneToCanvas(t),
        setSize: (w, h) => {
          exportCvs.width = w;
          exportCvs.height = h;
        },
        begin: async () => {
          await Promise.all([
            document.fonts.load("148px 'Great Vibes'"),
            document.fonts.load("64px 'Playfair Display'"),
            document.fonts.ready
          ]).catch(() => {});
        }
      });
    })();
  </script>
