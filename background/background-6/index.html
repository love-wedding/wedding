  <title>Thiệp Dạm Ngõ – Hương Giang & Hoàng Duyệt</title>

    rel="stylesheet">
  <script>try { if (window.self !== window.top) document.documentElement.classList.add('embedded'); } catch (e) { document.documentElement.classList.add('embedded'); }</script>
  <style>
    :root {
      --bg: #efefef;
      --ink: #a42331;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Times New Roman", Tinos, "Liberation Serif", Times, serif;
    }

    /* Canvas luôn lấp đầy màn hình theo tỉ lệ 16:9 (nền cùng màu nên nhìn như full màn hình) */
    #stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
      background: var(--bg);
    }

    #bar {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(164, 35, 49, .18);
      border-radius: 999px;
      box-shadow: 0 6px 24px rgba(120, 30, 45, .18);
      transition: opacity .35s, transform .35s;
      z-index: 5;
    }

    #bar.hide {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
    }

    /* Nhúng trong trang edit (iframe): ẩn thanh công cụ. Mở trực tiếp file HTML: vẫn hiện để xuất video thủ công. */
    html.embedded #bar {
      display: none !important;
    }

    button,
    label.btn,
    select {
      font: 600 14px/1 "Times New Roman", Tinos, serif;
      color: var(--ink);
      background: #fff;
      border: 1px solid rgba(164, 35, 49, .35);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    button:hover,
    label.btn:hover {
      background: #fbeef0;
    }

    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    button.primary:hover {
      background: #8c1c29;
    }

    button:disabled {
      opacity: .6;
      cursor: progress;
    }

    select {
      padding: 9px 12px;
    }

    svg {
      width: 16px;
      height: 16px;
      flex: none;
    }

    #msg {
      font: italic 600 14px "Times New Roman", Tinos, serif;
      color: var(--ink);
      padding: 0 6px;
      min-width: 0;
    }

    #prog {
      position: fixed;
      left: 0;
      top: 0;
      height: 4px;
      width: 0;
      background: var(--ink);
      z-index: 6;
      transition: width .15s linear;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font: italic 600 20px "Times New Roman", Tinos, serif;
      z-index: 9;
      transition: opacity .4s;
    }

    #loading.gone {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width:640px) {
      #bar {
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 22px;
        width: calc(100vw - 24px);
      }
    }
  </style>
</head>

<body>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <div id="prog"></div>
  <div id="loading">Đang tải…</div>

    <span id="msg"></span>
  </div>

      const k = Math.floor(p), r = p - k; return arr[k] + (arr[k + 1] - arr[k]) * r;
    }
    const prog = (f, a, b, e) => { const u = clamp((f - a) / (b - a)); return e ? easeOut(u) : u; };

    function drawText(key, f) {
      const t = TXT[key], s = CONFIG[key]; if (!s) return;
      const p = t.a === undefined ? 1 : prog(f, t.a, t.b, t.ease);
      if (p <= 0) return;
      ctx.font = `${t.st} ${t.w} ${t.size}px ${FF}`;
      ctx.letterSpacing = t.ls + 'px';
      const w = ctx.measureText(s).width - t.ls;
      const x = t.cx - w / 2;
      ctx.save();
      if (p < 1) { ctx.beginPath(); ctx.rect(x - 3, t.y - t.size * 1.2, (w + 6) * p, t.size * 1.6); ctx.clip(); }
      ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillText(s, x, t.y);
      ctx.restore();
      ctx.letterSpacing = '0px';
    }

    let customNames = null; // { groom: '...', bride: '...' }
    let namesFontReady = Promise.resolve();
    function loadNamesFont(c) {
      try {
        const font = c.font || '"Great Vibes", cursive';
        const sample = (c.groom || '') + (c.bride || '') + 'Aa';
        return document.fonts.load(`${c.size || 60}px ${font}`, sample).catch(() => { });
      } catch (_) { return Promise.resolve(); }
    }

    function drawNames(f) {
      if (customNames && (customNames.groom || customNames.bride)) {
        const p1 = prog(f, 4, 18, true);
        const p2 = prog(f, 28, 45, true);
        const font = customNames.font || '"Great Vibes", cursive';
        const size = customNames.size || 60;
        const color = customNames.color || INK;

        if (customNames.groom && p1 > 0) {
          ctx.save();
          ctx.font = `${size}px ${font}`;
          ctx.fillStyle = color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const gx = customNames.posX !== undefined ? (280 + Number(customNames.posX)) : 280;
          const gy = customNames.posY !== undefined ? Number(customNames.posY) : 190;
          if (p1 < 1) {
            ctx.beginPath();
            ctx.rect(gx - 200, gy - size, 400 * p1, size * 2);
            ctx.clip();
          }
          ctx.fillText(customNames.groom, gx, gy);
          ctx.restore();
        }

        if (customNames.bride && p2 > 0) {
          ctx.save();
          ctx.font = `${size}px ${font}`;
          ctx.fillStyle = color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const bx = customNames.posX !== undefined ? (740 + Number(customNames.posX)) : 740;
          const by = customNames.posY !== undefined ? Number(customNames.posY) : 270;
          if (p2 < 1) {
            ctx.beginPath();
            ctx.rect(bx - 200, by - size, 400 * p2, size * 2);
            ctx.clip();
          }
          ctx.fillText(customNames.bride, bx, by);
          ctx.restore();
        }
        return;
      }

      ctx.fillStyle = INK;
      for (const n of NAMES) {
        const p = prog(f, n.a, n.b); if (p <= 0) continue;
        ctx.save();
        if (p < 1) { ctx.beginPath(); ctx.rect(n.bb[0] - 2, n.bb[1] - 2, (n.bb[2] - n.bb[0] + 4) * p, n.bb[3] - n.bb[1] + 4); ctx.clip(); }
        ctx.fill(n.path, 'nonzero');
        ctx.restore();
      }
    }

    function render(t) {
      const f = t * FPS;                       // khung (số thực) trong video
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#efefef'; ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.setTransform(S, 0, 0, S, 0, 0);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

      // 1) nền + hoa (fade-in đầu video, hoa góc phải fade-out cuối video)
      const aIn = table(FADE_IN, 0, f);
      const aTR = f >= 798 ? table(FADE_OUT, 798, f) : 1;
      ctx.globalAlpha = aIn; ctx.drawImage(imgs.base, 0, 0, 1024, 576);
      ctx.globalAlpha = aIn * aTR; ctx.drawImage(imgs.tr, TR_RECT[0], TR_RECT[1]);
      ctx.globalAlpha = 1;

      // 2) chữ 囍 (có ngay từ khung 0)
      ctx.drawImage(imgs.xi, XI_RECT[0], XI_RECT[1]);

      // 3) nhẫn xoay 3D (sprite từ video, lặp mỗi 609 khung, nội suy giữa 2 khung sprite)
      const pos = (f % RING_PERIOD) / RING_STEP, k0 = Math.floor(pos), fr = pos - k0;
      const spr = k => {
        const kk = k % RING_N, [dx, dy, dw, dh] = RING_RECT;
        ctx.drawImage(imgs.ring, (kk % RING_COLS) * dw, Math.floor(kk / RING_COLS) * dh, dw, dh, dx, dy, dw, dh);
      };
      spr(k0);
      if (fr > 0.02) { ctx.globalAlpha = fr; spr(k0 + 1); ctx.globalAlpha = 1; }

      // 4) chữ hiện dần
      drawText('title', f);
      drawNames(f);
      drawText('thanks1', f);
      drawText('thanks2', f);

      // 5) khối ngày (có sẵn từ khung 0)
      ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.lineCap = 'butt';
      for (const [x1, y1, x2, y2] of RULES) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
      ['month', 'day', 'year', 'weekday', 'lunar'].forEach(k => drawText(k, f));
    }

    /* ---------- VÒNG LẶP PHÁT ---------- */
    function loop(now) {
      if (recording) return;
      render(((now - playStart) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    }
    function play() { cancelAnimationFrame(rafId); playStart = performance.now(); rafId = requestAnimationFrame(loop); }

    /* ---------- XUẤT VIDEO ---------- */
    let audioBuf = null;
    const $ = id => document.getElementById(id);
    const msg = t => $('msg').textContent = t || '';

    function pickMime() {
      const list = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4',
        'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      return list.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    }

    async function exportVideo() {
      if (recording) return;
      if (!window.MediaRecorder) { msg('Trình duyệt không hỗ trợ xuất video – hãy dùng Chrome/Edge.'); return; }
      const mime = pickMime();
      const [W, H] = $('selRes').value.split('x').map(Number);
      await Promise.race([namesFontReady, new Promise(r => setTimeout(r, 2500))]);
      cancelAnimationFrame(rafId); recording = true;
      cvs.width = W; cvs.height = H; S = W / 1024;
      $('btnDl').disabled = true; $('dlLabel').textContent = 'Đang xuất…';
      $('bar').classList.remove('hide'); keepBar = true;

      const stream = cvs.captureStream(FPS);
      let ac = null, src = null;
      if (audioBuf) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const dest = ac.createMediaStreamDestination();
        src = ac.createBufferSource(); src.buffer = audioBuf; src.connect(dest);
        dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
      }
      const rec = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: Math.round(W * H * FPS * 0.22) }, mime ? { mimeType: mime } : {}));
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const done = new Promise(res => rec.onstop = res);

      render(0);
      rec.start(250);
      const t0 = performance.now();
      if (src) src.start(0, 0, DUR);
      await new Promise(resolve => {
        (function step() {
          const t = (performance.now() - t0) / 1000;
          if (t >= DUR) { render(DUR - 1 / FPS); resolve(); return; }
          render(t);
          $('prog').style.width = (t / DUR * 100).toFixed(1) + '%';
          msg(`Đang ghi ${Math.round(t / DUR * 100)}% – giữ tab này mở`);
          requestAnimationFrame(step);
        })();
      });
      await new Promise(r => setTimeout(r, 300));       // đợi khung cuối được ghi
      rec.stop(); await done;
      if (ac) ac.close();

      const type = (rec.mimeType || mime || 'video/webm').split(';')[0];
      const ext = type.includes('mp4') ? 'mp4' : 'webm';
      const url = URL.createObjectURL(new Blob(chunks, { type }));
      const a = document.createElement('a'); a.href = url; a.download = `thiep-dam-ngo.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);

      recording = false; keepBar = false;
      $('btnDl').disabled = false; $('dlLabel').textContent = 'Tải video';
      $('prog').style.width = '0'; msg(`Đã xuất ${W}×${H} (.${ext})`); setTimeout(() => msg(''), 5000);
      play();
    }

    /* ---------- UI ---------- */
    let keepBar = false, hideTimer = 0;
    function showBar() {
      $('bar').classList.remove('hide'); clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { if (!keepBar) $('bar').classList.add('hide'); }, 2800);
    }
    ['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(e => addEventListener(e, showBar, { passive: true }));
    function toggleFull() {
      const el = document.documentElement;
      if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen).call(el); else document.exitFullscreen();
    }
    $('btnFull').onclick = toggleFull;
    $('btnReplay').onclick = () => { if (!recording) play(); };
    $('btnDl').onclick = exportVideo;
    $('selRes').onchange = () => { if (recording) return; const [W, H] = $('selRes').value.split('x').map(Number); cvs.width = W; cvs.height = H; S = W / 1024; };
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'f') toggleFull(); else if (k === 'r' && !recording) play(); else if (k === 'd') exportVideo();
    });
    $('music').onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        audioBuf = await ac.decodeAudioData(await file.arrayBuffer()); ac.close();
        $('musicName').textContent = file.name.length > 22 ? file.name.slice(0, 20) + '…' : file.name;
      } catch (err) { audioBuf = null; msg('Không đọc được file nhạc này.'); }
    };

    /* ---------- KHỞI ĐỘNG ---------- */
    function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
    (async function init() {
      for (const k in NAMES) NAMES[k].path = new Path2D(NAMES[k].d);
      const keys = Object.keys(IMG_SRC);
      const loaded = await Promise.all(keys.map(k => loadImg(IMG_SRC[k])));
      keys.forEach((k, i) => imgs[k] = loaded[i]);
      // đảm bảo font Times/Tinos đã sẵn sàng trước khi vẽ (tối đa 2.5s nếu offline)
      try {
        const sample = 'LỄ DẠM NGÕ thương đắp 0123456789';
        await Promise.race([
          Promise.all(['italic 400', 'italic 700', 'normal 700'].map(s => document.fonts.load(`${s} 30px "Times New Roman"`, sample)
            .then(r => r.length ? r : document.fonts.load(`${s} 30px Tinos`, sample)))),
          new Promise(r => setTimeout(r, 2500))
        ]);
      } catch (_) { }
      $('loading').classList.add('gone');
      play(); showBar();
    })();

    /* ===== CẦU NỐI ĐỒNG BỘ DỮ LIỆU ĐỘNG (BACKGROUND BRIDGE) ===== */
    (function () {
      function parseDateParts(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.trim().split(/[./-]/);
        if (parts.length >= 3) {
          return { d: parts[0], m: parts[1], y: parts[2] };
        }
        return null;
      }

      function apply(d) {
        if (!d) return;
        const groom = d.groomName || d.groom;
        const bride = d.brideName || d.bride;
        const date = d.weddingDate || d.date;
        const title = d.title;
        const slogan = d.slogan;

        if (groom || bride) {
          // Tên gốc của mẫu là nét vẽ vector thư pháp (rất đẹp, không phải font chữ).
          // Chỉ chuyển sang vẽ bằng font khi người dùng THỰC SỰ đổi tên; nếu không,
          // trang chỉnh sửa sẽ hiển thị y hệt khi mở file HTML trực tiếp.
          const norm = s => (s || '').normalize('NFC').trim().replace(/\s+/g, ' ').toLowerCase();
          const a = norm(groom), b = norm(bride);
          const O1 = norm('Hương Giang'), O2 = norm('Hoàng Duyệt');
          const isOriginal = (a === O1 && b === O2) || (a === O2 && b === O1);
          if (isOriginal) {
            customNames = null;
          } else {
            customNames = {
              groom: groom || '',
              bride: bride || '',
              font: d.namesFontFamily,
              size: d.namesFontSize ? Number(d.namesFontSize) : 60,
              color: d.namesColor,
              posY: d.namesPosY,
              posX: d.namesPosX,
            };
            // Canvas không tự đợi webfont: chủ động nạp để không bị rơi về font hệ thống
            namesFontReady = loadNamesFont(customNames);
          }
        }

        if (title) {
          CONFIG.title = title;
        }
        if (d.titleFontSize && TXT.title) TXT.title.size = Number(d.titleFontSize);
        if (d.titlePosY && TXT.title) TXT.title.y = Number(d.titlePosY);

        if (slogan) {
          CONFIG.thanks1 = slogan;
          CONFIG.thanks2 = '';
        }

        if (date) {
          const dp = parseDateParts(date);
          if (dp) {
            CONFIG.day = dp.d;
            CONFIG.month = 'THÁNG ' + dp.m;
            CONFIG.year = dp.y;
          }
        }
      }

      // Đọc params ban đầu
      try {
        const q = new URLSearchParams(window.location.search);
        const mapping = { groomName: 'groom', brideName: 'bride', weddingDate: 'date', initial1: 'init1', initial2: 'init2', title: 'title', slogan: 'slogan', namesFontFamily: 'namesFontFamily', namesColor: 'namesColor', monoFontFamily: 'monoFontFamily', monoColor: 'monoColor', dateFontFamily: 'dateFontFamily', dateColor: 'dateColor', titleFontFamily: 'titleFontFamily', titleColor: 'titleColor' };
        const d = {};
        Object.keys(mapping).forEach(k => { if (q.has(mapping[k])) d[k] = q.get(mapping[k]); });
        ['namesFontSize', 'namesPosY', 'namesPosX', 'monoFontSize', 'monoPosY', 'monoPosX', 'dateFontSize', 'datePosY', 'datePosX', 'titleFontSize', 'titlePosY', 'titlePosX'].forEach(k => { if (q.has(k)) d[k] = Number(q.get(k)); });
        apply(d);
      } catch (e) { }

      // Lắng nghe postMessage
      window.addEventListener('message', e => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'UPDATE_STAGE_DATA' || e.data.type === 'UPDATE_BACKGROUND_DATA' || e.data.type === 'UPDATE_WEDDING_DATA') {
          apply(e.data.payload || {});
        }
      });

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'BACKGROUND_READY' }, '*');
      }
    })();
  </script>
  <!-- Xuất MP4 theo từng frame, kích hoạt từ trang edit qua postMessage TRIGGER_EXPORT_VIDEO -->
  <script src="../vendor/mp4-muxer.js"></script>
  <script src="../export-video.js"></script>
  <script>
    BgVideoExport.init({
      canvas: cvs,
      duration: DUR,
      fileName: 'thiep-dam-ngo',
      render: t => render(t),
      setSize: (w, h) => { cvs.width = w; cvs.height = h; S = w / 1024; },
      begin: async () => {
        cancelAnimationFrame(rafId); recording = true;               // dừng vòng lặp phát
        await Promise.race([namesFontReady, new Promise(r => setTimeout(r, 2500))]);
      },
      end: () => { recording = false; play(); }                       // phát lại như cũ
    });
  </script>
