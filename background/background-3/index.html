<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lễ Dạm Ngõ — Hoàng Đức &amp; Kim Ngân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../fonts/names-fonts.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:wght@500;700&family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #111;
      --wine: #7d1c3b;
      /* tên cô dâu chú rể */
      --rose-text: #9a1b3a;
      /* đoạn cảm ơn + ngày */
      --囍: #dfc4ca;
      --paper: #faf8f6;
      --pink: #f9c9cf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      background: #fff;
      overflow: hidden
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #fff
    }

    /* Sân khấu thiết kế 1920×1080, tự co giãn theo màn hình */
    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      overflow: hidden;
      background: #fff;
      font-family: "Cormorant Garamond", "Playfair Display", serif;
      color: var(--ink)
    }

    /* ---------- nền ---------- */
    .paper {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.6s ease;
      background-color: var(--paper);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='p' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.9 .75' numOctaves='4' seed='7' result='n'/><feDiffuseLighting in='n' lighting-color='%23ffffff' surfaceScale='1.6'><feDistantLight azimuth='45' elevation='62'/></feDiffuseLighting></filter><rect width='600' height='600' filter='url(%23p)' opacity='.38'/></svg>");
      background-size: 600px 600px;
      background-blend-mode: multiply
    }

    .paper.on {
      opacity: 1
    }

    .blush {
      position: absolute;
      border-radius: 50%;
      filter: blur(38px);
      pointer-events: none;
      will-change: transform
    }

    .blush.tl {
      left: -260px;
      top: -200px;
      width: 900px;
      height: 620px;
      background: radial-gradient(closest-side, rgba(249, 196, 203, .7), rgba(249, 200, 206, .4) 55%, rgba(249, 205, 210, 0) 100%);
      animation: drift 14s ease-in-out infinite alternate
    }

    .blush.br {
      right: -300px;
      bottom: -260px;
      width: 1000px;
      height: 640px;
      background: radial-gradient(closest-side, rgba(249, 190, 198, .7), rgba(249, 198, 204, .38) 55%, rgba(249, 205, 210, 0) 100%);
      animation: drift 17s ease-in-out -6s infinite alternate-reverse
    }

    .blush.tl.b {
      left: 20px;
      top: -120px;
      width: 420px;
      height: 300px;
      opacity: .45;
      filter: blur(30px)
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1)
      }

      to {
        transform: translate(24px, 16px) scale(1.06)
      }
    }

    /* ---------- hoa ---------- */
    .flora {
      position: absolute;
      pointer-events: none;
      will-change: transform
    }

    .flora canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    #floraBL {
      left: -170px;
      bottom: -44px;
      width: 704px;
      height: 534px;
      transform-origin: 20% 90%
    }

    #floraTR {
      right: -56px;
      top: -8px;
      width: 420px;
      height: 525px;
      transform-origin: 80% 10%
    }

    #petals {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    /* ---------- lớp chữ ---------- */
    #content {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px
    }

    .layer {
      position: absolute;
      inset: 0;
      text-align: center
    }

    .fade {
      opacity: 0;
      will-change: opacity, transform
    }

    .title {
      position: absolute;
      left: 0;
      right: 0;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap
    }

    /* cảnh 1 */
    #s1 .title {
      top: 38px;
      font-size: 86px;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      color: #0d0d0d;
      letter-spacing: .015em
    }

    .name {
      position: absolute;
      font-family: "Great Vibes", cursive;
      color: var(--wine);
      font-size: 132px;
      line-height: .98;
      text-align: center;
      width: 620px
    }

    #nameL {
      left: 190px;
      top: 292px
    }

    #nameR {
      left: 1118px;
      top: 292px
    }

    #xi {
      position: absolute;
      left: 50%;
      top: 228px;
      width: 420px;
      height: 420px;
      transform: translateX(-50%);
      text-align: center
    }

    #xi .glyph {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      font-weight: 900;
      font-size: 410px;
      line-height: 420px;
      height: 420px;
      color: var(--囍);
      display: block
    }

    #xi svg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 170px;
      transform: translate(-50%, -52%) rotate(-6deg);
      overflow: visible
    }

    #thanks {
      position: absolute;
      left: 0;
      right: 0;
      top: 758px;
      font-family: "Great Vibes", cursive;
      font-size: 44px;
      color: var(--wine);
      white-space: nowrap
    }

    .date {
      position: absolute;
      left: 50%;
      top: 860px;
      width: 1000px;
      transform: translateX(-50%);
      height: 200px;
      font-family: "Cormorant Garamond", serif
    }

    .date .m {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      font-size: 46px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #111;
      line-height: 1
    }

    .date .d {
      position: absolute;
      left: 0;
      right: 0;
      top: 50px;
      font-size: 92px;
      font-weight: 600;
      line-height: 1;
      color: #111
    }

    .date .y {
      position: absolute;
      left: 0;
      right: 0;
      top: 148px;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: .05em;
      color: #111;
      line-height: 1
    }

    .date .side {
      position: absolute;
      top: 87px;
      width: 395px;
      height: 62px;
      border-top: 5px solid #111;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: .04em;
      padding-top: 10px;
      color: #111;
      text-transform: uppercase
    }

    .date .side.l {
      left: 0
    }

    .date .side.r {
      right: 0
    }

    /* cảnh 2 */
    #s2 .title {
      top: 100px;
      font-size: 96px;
      font-weight: 500;
      color: #141414;
      letter-spacing: .01em;
      word-spacing: -.06em
    }

    #msg {
      position: absolute;
      left: 0;
      right: 0;
      top: 318px;
      font-family: "Great Vibes", cursive;
      font-size: 56px;
      line-height: 1.52;
      color: var(--rose-text)
    }

    #msg .ln {
      display: block;
      white-space: nowrap
    }

    #msg .c {
      opacity: 0;
      display: inline-block;
      white-space: pre;
      transform: translateY(5px);
      filter: blur(2px)
    }

    #msg .c.in {
      opacity: 1;
      transform: none;
      filter: none;
      transition: opacity .28s ease, transform .28s ease, filter .28s ease
    }

    #date2 {
      position: absolute;
      left: 0;
      right: 0;
      top: 945px;
      font-family: "Great Vibes", cursive;
      font-size: 48px;
      color: var(--rose-text)
    }


    #fsBtn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      background: rgba(125, 28, 59, .88);
      color: #fff;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity .35s;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .18)
    }

    #fsBtn svg {
      width: 22px;
      height: 22px
    }

    #fsBtn:focus-visible {
      opacity: 1;
      outline: 3px solid #fff;
      outline-offset: 2px
    }

    body.ui #fsBtn {
      opacity: 1
    }

    body.idle {
      cursor: none
    }

    @media (prefers-reduced-motion:reduce) {
      .blush {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div id="viewport">
    <div id="stage">

      <div class="paper" id="paper"></div>
      <div class="blush tl"></div>
      <div class="blush tl b"></div>
      <div class="blush br"></div>
      <canvas id="petals"></canvas>

      <div class="flora" id="floraBL"><canvas id="cBL"></canvas></div>
      <div class="flora" id="floraTR"><canvas id="cTR"></canvas></div>

      <div id="content">
        <!-- CẢNH 1 -->
        <div class="layer" id="s1">
          <h1 class="title fade" id="t1">LỄ DẠM NGÕ</h1>
          <div class="name fade" id="nameL">Hoàng<br>Đức</div>
          <div class="name fade" id="nameR">Kim<br>Ngân</div>
          <div id="xi" class="fade">
            <span class="glyph">囍</span>
            <svg viewBox="0 0 120 90" fill="none" stroke="#8c3c4d" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <ellipse cx="42" cy="50" rx="27" ry="23" transform="rotate(-22 42 50)" />
              <ellipse cx="42" cy="50" rx="21" ry="17" transform="rotate(-22 42 50)" />
              <ellipse cx="72" cy="42" rx="27" ry="23" transform="rotate(-22 72 42)" />
              <ellipse cx="72" cy="42" rx="21" ry="17" transform="rotate(-22 72 42)" />
              <path d="M95 20l7-6 9 3 3 8-6 8-9-1z" fill="#f2d5da" />
              <path d="M102 14l3 11M111 17l-9 11M95 20l12 8" stroke-width="1.2" />
            </svg>
          </div>
          <p id="thanks" class="fade">Xin cảm ơn hai bên gia đình đã yêu thương và vun đắp cho chúng con</p>
          <div class="date fade" id="date1">
            <div class="m">THÁNG 9</div>
            <div class="d">14</div>
            <div class="y">2026</div>
            <div class="side l">Thứ sáu</div>
            <div class="side r">04/08 Bính Ngọ</div>
          </div>
        </div>

        <!-- CẢNH 2 -->
        <div class="layer" id="s2">
          <h2 class="title fade" id="t2">LỄ DẠM NGÕ</h2>
          <div id="msg"></div>
          <div id="date2" class="fade">14.09.2026</div>
        </div>
      </div>

    </div>
  </div>
  <button id="fsBtn" type="button" aria-label="Bật/tắt toàn màn hình" title="Toàn màn hình (F hoặc nhấp đúp)"><svg
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
    </svg></button>

    const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- co giãn sân khấu ---------- */
    const stage = document.getElementById('stage');
    let SW = 1920, SH = 1080;
    /* Sân khấu tự giãn theo tỉ lệ màn hình: nền + hoa phủ kín, chữ luôn nằm giữa vùng 1920×1080 */
    function fit() {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      SW = innerWidth / s; SH = innerHeight / s;
      stage.style.width = SW + 'px'; stage.style.height = SH + 'px'; stage.style.transform = `scale(${s})`;
      const c = document.getElementById('content'); c.style.left = (SW - 1920) / 2 + 'px'; c.style.top = (SH - 1080) / 2 + 'px';
      const p = document.getElementById('petals'); p.width = Math.ceil(SW); p.height = Math.ceil(SH); p.style.width = SW + 'px'; p.style.height = SH + 'px';
    }
    addEventListener('resize', fit); fit();

    /* ---------- hoa chuyển động như gió thổi ----------
       Cắt ảnh thành các dải ngang rồi lệch từng dải theo sóng gió;
       càng xa góc neo (gốc cụm hoa) thì lá/cánh lay càng mạnh. */
    function Flora(canvasId, src, anchor, cfg) {
      const cv = document.getElementById(canvasId), ctx = cv.getContext('2d');
      const img = new Image(); img.src = src;
      const o = { amp: 16, rot: .9, ...cfg };
      img.onload = () => { cv.width = img.width; cv.height = img.height; o.ready = true; draw(0) };
      const ROW = 5;
      function draw(t) {
        if (!o.ready) return; const W = cv.width, H = cv.height;
        ctx.clearRect(0, 0, W, H);
        const gust = .6 + .4 * Math.sin(t * .00031 + o.ph) * Math.sin(t * .00071);       // gió lúc mạnh lúc nhẹ
        for (let y = 0; y < H; y += ROW) {
          const dy = (y / H - anchor.y), dist = Math.min(1, Math.hypot(dy, 0.4) / 1.1);
          const w = Math.pow(dist, 1.6);
          const dx = Math.sin(t * .0012 + y * .011 + o.ph) * o.amp * w * gust
            + Math.sin(t * .0021 + y * .027 + o.ph * 2) * o.amp * .35 * w;
          ctx.drawImage(img, 0, y, W, ROW + 1, dx, y, W, ROW + 1);
        }
      }
      return { draw, o };
    }
    const fBL = Flora('cBL', IMG.bl, { x: .1, y: .95 }, { amp: 18, ph: 0 });
    const fTR = Flora('cTR', IMG.tr, { x: .9, y: .05 }, { amp: 15, ph: 2.1 });
    const elBL = document.getElementById('floraBL'), elTR = document.getElementById('floraTR');

    /* ---------- cánh hoa rơi ---------- */
    const pc = document.getElementById('petals'), pctx = pc.getContext('2d');
    const petals = Array.from({ length: 26 }, (_, i) => mk(true));
    function mk(init) {
      return {
        x: Math.random() * SW, y: init ? Math.random() * SH : -40, s: 9 + Math.random() * 16, vy: 14 + Math.random() * 26,
        sw: 20 + Math.random() * 40, f: .4 + Math.random() * .8, ph: Math.random() * 6.3, rot: Math.random() * 6.3, vr: (Math.random() - .5) * 1.2,
        flip: Math.random() * 6.3, fs: .8 + Math.random() * 1.4, a: .55 + Math.random() * .4
      }
    }
    function petal(p, t) {
      pctx.save(); pctx.translate(p.x + Math.sin(t * .001 * p.f + p.ph) * p.sw, p.y); pctx.rotate(p.rot);
      pctx.scale(Math.abs(Math.cos(p.flip)) * .8 + .2, 1); pctx.globalAlpha = p.a;
      const s = p.s, g = pctx.createLinearGradient(0, -s, 0, s); g.addColorStop(0, '#f7a9b6'); g.addColorStop(1, '#f4859b');

      pctx.bezierCurveTo(s * .9, -s * .6, s * .8, s * .7, 0, s); pctx.bezierCurveTo(-s * .8, s * .7, -s * .9, -s * .6, 0, -s); pctx.fill(); pctx.restore();
    }
    let lastT = 0;
    function drawPetals(t) {
      const dt = Math.min(.05, (t - lastT) / 1000); lastT = t; pctx.clearRect(0, 0, SW, SH);
      for (const p of petals) { p.y += p.vy * dt; p.rot += p.vr * dt; p.flip += p.fs * dt; if (p.y > SH + 40) Object.assign(p, mk(false), { x: Math.random() * SW }); petal(p, t) }

    function typeTo(list, n) { for (let i = 0; i < list.length; i++) { const on = i < n; if (on !== list[i].classList.contains('in')) list[i].classList.toggle('in', on) } }

    let t0 = performance.now();

        if (date) {
          if (date2) date2.textContent = date;
          const dp = parseDateParts(date);

        if (slogan && thanks) {

            if (d.namesColor) nameR.style.color = d.namesColor;
            if (d.namesPosY !== undefined && d.namesPosY !== '') nameR.style.top = d.namesPosY + 'px';
            if (d.namesPosX !== undefined && d.namesPosX !== '') nameR.style.left = (1118 + Number(d.namesPosX)) + 'px';
          }
        }

        if (t1) setStyle(t1, d.titleFontSize, d.titleFontFamily, d.titleColor, d.titlePosY, d.titlePosX);
        if (t2) setStyle(t2, d.titleFontSize, d.titleFontFamily, d.titleColor, d.titlePosY, d.titlePosX);

        if (date1) {

              c.style.color = d.dateColor;

          if (d.monoPosY !== undefined && d.monoPosY !== '') xiEl.style.top = d.monoPosY + 'px';

            xiEl.style.transform = `translateX(calc(-50% + ${d.monoPosX}px))`;
            xiEl.dataset.base = `translateX(calc(-50% + ${d.monoPosX}px))`;

      }

      // Đọc params ban đầu
      try {
        const q = new URLSearchParams(window.location.search);
        const mapping = { groomName: 'groom', brideName: 'bride', weddingDate: 'date', initial1: 'init1', initial2: 'init2', title: 'title', slogan: 'slogan', namesFontFamily: 'namesFontFamily', namesColor: 'namesColor', monoFontFamily: 'monoFontFamily', monoColor: 'monoColor', dateFontFamily: 'dateFontFamily', dateColor: 'dateColor', titleFontFamily: 'titleFontFamily', titleColor: 'titleColor' };
        const d = {};
        Object.keys(mapping).forEach(k => { if (q.has(mapping[k])) d[k] = q.get(mapping[k]); });
        ['namesFontSize', 'namesPosY', 'namesPosX', 'monoFontSize', 'monoPosY', 'monoPosX', 'dateFontSize', 'datePosY', 'datePosX', 'titleFontSize', 'titlePosY', 'titlePosX'].forEach(k => { if (q.has(k)) d[k] = Number(q.get(k)); });
        apply(d);
      } catch (e) { }

      // Lắng nghe postMessage
      window.addEventListener('message', e => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'UPDATE_STAGE_DATA' || e.data.type === 'UPDATE_BACKGROUND_DATA' || e.data.type === 'UPDATE_WEDDING_DATA') {
          apply(e.data.payload || {});
        }
      });

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'BACKGROUND_READY' }, '*');
      }
    })();

  <script>
    (function() {

        title: "LỄ DẠM NGÕ",

        namesPosX: 0,
        monoFontSize: 410,
        monoFontFamily: "'Noto Sans TC', sans-serif",
        monoColor: "#dfc4ca",
        monoPosY: 228,
        monoPosX: 0,
        dateFontSize: 92,
        dateFontFamily: "'Cormorant Garamond', serif",
        dateColor: "#111111",
        datePosY: 860,
        datePosX: 0,

        titleFontFamily: "'Cormorant Garamond', serif",
        titleColor: "#0d0d0d",
        titlePosY: 38,
        titlePosX: 0
      };

      function renderSceneToCanvas(t) {
        const W = exportCvs.width;
        const H = exportCvs.height;
        const s = W / 1920;
        const d = Object.assign({}, defaultData, window.__currentData || {});
        const ms = t * 1000;
        const T = t % 41;

        exportCtx.setTransform(1, 0, 0, 1, 0, 0);
        // 1. Solid opaque paper background (chống hoàn toàn video đen trên Windows Media Player)
        exportCtx.fillStyle = '#faf8f6';
        exportCtx.fillRect(0, 0, W, H);

        // 2. Corner blush
        const gTR = exportCtx.createRadialGradient(W, 0, 0, W, 0, 0.5 * W);
        gTR.addColorStop(0, 'rgba(249, 201, 207, 0.45)');
        gTR.addColorStop(1, 'rgba(249, 201, 207, 0)');
        exportCtx.fillStyle = gTR;
        exportCtx.fillRect(0, 0, W, H);

        const gBL = exportCtx.createRadialGradient(0, H, 0, 0, H, 0.5 * W);
        gBL.addColorStop(0, 'rgba(249, 201, 207, 0.45)');
        gBL.addColorStop(1, 'rgba(249, 201, 207, 0)');
        exportCtx.fillStyle = gBL;
        exportCtx.fillRect(0, 0, W, H);

        // 3. Flowers
        if (typeof fBL !== 'undefined' && fBL.draw) fBL.draw(ms);
        if (typeof fTR !== 'undefined' && fTR.draw) fTR.draw(ms);

        const cvTR = document.getElementById('cTR');
        if (cvBL && cvBL.width) {
          exportCtx.save();
          exportCtx.translate(0, H);
          exportCtx.rotate((Math.sin(ms * .0009) * .7) * Math.PI / 180);
          exportCtx.drawImage(cvBL, 0, -740 * s, 900 * s, 740 * s);
          exportCtx.restore();
        }
        if (cvTR && cvTR.width) {
          exportCtx.save();
          exportCtx.translate(W, 0);
          exportCtx.rotate((Math.sin(ms * .0008 + 1.4) * -.7) * Math.PI / 180);
          exportCtx.drawImage(cvTR, -860 * s, 0, 860 * s, 720 * s);
          exportCtx.restore();
        }

        // 4. Petals
        if (typeof drawPetals === 'function') drawPetals(ms);
        const cvPetals = document.getElementById('petals');
        if (cvPetals && cvPetals.width) {
          exportCtx.drawImage(cvPetals, 0, 0, W, H);
        }

        // 5. Scene cross-fade
        let s1Alpha = 1;
        let s2Alpha = 0;
        if (T >= 13.5 && T <= 14.8) {
          const p = (T - 13.5) / 1.3;
          s1Alpha = 1 - p;
          s2Alpha = p;
