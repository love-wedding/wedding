<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Save the Date – Quốc Anh & Kiều Hân</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"

      --bg: #020207;
      --ink: #eef0fa;
      --soft: #b9bfe0;

      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

      :root:not([data-theme="light"]) {
        --bg: #020207;
        --ink: #eef0fa;
        --soft: #b9bfe0;
      }
    }

    :root[data-theme="dark"] {
      --bg: #020207;
      --ink: #eef0fa;
      --soft: #b9bfe0;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #stage {
      position: fixed;
      left: 0;
      top: 0;
      width: 1024px;
      height: 576px;
      transform-origin: 0 0;
      pointer-events: none;
      color: var(--ink);
      text-align: center;
    }

    .t {
      position: absolute;
      left: 0;
      width: 1024px;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(6px);
      transition:
        opacity 1.3s ease,
        filter 1.3s ease,
        transform 1.3s ease;
    }

    .t.on {
      opacity: 1;
      filter: none;
      transform: none;
    }

    .m {
      font:
        400 76px/80px "Pinyon Script",
        cursive;
      text-shadow: 0 0 18px rgba(200, 210, 255, 0.4);
    }

    .m span {
      display: inline-block;
      position: relative;
      top: 18px;
      margin-left: -0.3em;
    }

    #mono {
      top: 52px;
    }

    #mono2 {
      top: 74px;
    }

    #sd {
      top: 200px;
      font:
        500 15px/20px "Cormorant Garamond",
        serif;
      letter-spacing: 0.58em;
      text-indent: 0.58em;
      color: #c4c9e2;
    }

    #names {
      top: 248px;
      font:
        400 52px/68px "Pinyon Script",
        cursive;
      word-spacing: 0.42em;
      letter-spacing: 0.03em;
      text-shadow: 0 0 14px rgba(200, 210, 255, 0.3);
    }

    #names s {
      text-decoration: none;
      font-size: 0.5em;
      color: var(--soft);
    }

    #date {
      top: 339px;
      font:
        500 19px/26px "Cormorant Garamond",
        serif;
      letter-spacing: 0.1em;
      color: #d6d9ec;
    }

    #love {
      top: 260px;
      font:
        500 15px/20px "Cormorant Garamond",
        serif;
      letter-spacing: 0.53em;
      text-indent: 0.53em;
      color: #c4c9e2;
    }

    #hearts {
      top: 304px;
      font: 13px/20px serif;
      letter-spacing: 1.1em;
      text-indent: 1.1em;
      color: var(--soft);
    }

    #ui {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      font:
        500 13px/1.4 "Cormorant Garamond",
        Georgia,
        serif;
      color: var(--ink);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      text-align: right;
    }

    #ui.show,
    #ui.open {
      opacity: 1;
      pointer-events: auto;
    }

    body.hide-export #ui,
    #ui.hide-export {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #ui button,
    #ui select {
      font: inherit;
      color: var(--ink);
      background: rgba(20, 22, 45, 0.8);
      border: 1px solid rgba(185, 191, 224, 0.4);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }

    #ui button:hover {
      border-color: rgba(220, 226, 255, 0.9);
    }

    #ui button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #xp {
      display: none;
      margin-bottom: 8px;
      padding: 12px 14px;
      background: rgba(10, 11, 28, 0.88);
      border: 1px solid rgba(185, 191, 224, 0.3);
      border-radius: 12px;
      text-align: left;
      width: 250px;
      backdrop-filter: blur(6px);
    }

    #ui.open #xp {
      display: block;
    }

    #xp label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
    }

    #xbar {
      height: 5px;
      background: rgba(185, 191, 224, 0.2);
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0 6px;
      display: none;
    }

    #xbar i {
      display: block;
      height: 100%;
      width: 0;
      background: #c9d2ff;
    }

    #xmsg {
      font-size: 12px;
      color: var(--soft);
      min-height: 16px;
    }

    #xp .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    #xp .row button {
      flex: 1;
    }
  </style>
</head>

      // tính kích thước theo W,H hiện tại rồi dựng lại các hạt
      u = W < H ? W / 700 : Math.min(W / 1024, H / 576);
      su = Math.max(u, 0.7);
      cx = W * 0.49;
      cy = H * 0.76;
      rx = W * 0.17 * (W < H ? 1.6 : 1);
      build();
    }
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      cv.width = W * dpr;
      cv.height = H * dpr;
      layout();
      st.style.transform = `translate(${(W - 1024 * u) / 2}px,${(H - 576 * u) / 2}px) scale(${u})`;
    }
    const el = (id) => document.getElementById(id);
    const { S1_IN, S1_END } = CFG;
    const TXT = [
      [el("mono"), [S1_IN, S1_END]],
      [el("mono2"), [S2_START, S2_END]],
      [el("sd"), [S1_IN + 0.4, S1_END - 0.2]],
      [el("names"), [S1_IN + 0.6, S1_END - 0.1]],
      [el("date"), [S1_IN + 1.2, S1_END - 0.2]],
      [el("love"), [S2_START + 0.3, S2_END - 0.1]],
      [el("hearts"), [S2_START + 0.6, S2_END - 0.1]],
    ];
    let T0 = performance.now();
    let EXPORTING = false;
    function frame(now) {
      if (!EXPORTING) {
        const t = (now - T0) / 1000,
          p = t % CYCLE;
        for (const [e, w] of TXT) {
          const on = p >= w[0] && p < w[1];
          if (e.classList.contains("on") !== on)
            e.classList.toggle("on", on);
        }
        render(ctx, t, false);
      }
      requestAnimationFrame(frame);
    }
    function render(ctx, t, txt) {
      // vẽ 1 khung hình tại thời điểm t (txt=true: vẽ cả chữ lên canvas để xuất video)
      const p = t % CYCLE;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#020207";
      ctx.fillRect(0, 0, W, H);
      const z = 1 + 0.1 * sm((p - E) / 2.4); // cuối vòng: kéo gần (zoom) rồi tối dần
      ctx.translate(W / 2, H / 2);
      ctx.scale(z, z);
      ctx.translate(-W / 2, -H / 2);
      const zk = 1 + 0.8 * sm((p - E) / 2);
      ctx.fillStyle = "#f2f3ff";
      for (const s of SBIG) {
        const x = (((s.x + s.vx * t) % W) + W) % W,
          a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
        ctx.globalAlpha = a * 0.85;
        const sz = s.r * zk * 3;
        ctx.fillRect(x, s.y, sz, sz);
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = a * 0.5;
        ctx.drawImage(
          glow,
          x - s.r * 6,
          s.y - s.r * 6,
          s.r * 12,
          s.r * 12,
        );
        ctx.globalCompositeOperation = "source-over";
      }
      for (const g of SB) {
        const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * g.sp + g.ph));
        ctx.globalAlpha = a * 0.85;
        ctx.beginPath();
        for (const s of g.a) {
          const x = (((s.x + s.vx * t) % W) + W) % W,
            sz = s.r * zk * 1.6;
          ctx.rect(x, s.y, sz, sz);
        }
        ctx.fill();
      }
      ctx.globalCompositeOperation = "lighter";
      // hai cột sáng đứng yên giữa hai dải bụi
      [0.16, 0.87].forEach((px, i) => {
        ctx.globalAlpha = Math.min(
          1,
          0.4 +
          0.12 * Math.sin(t * 0.6 + i * 2.3) +
          (i ? 0.5 * sm((p - E + 0.2) / 1.4) : 0),
        );
        const w = 30 * su;
        ctx.drawImage(PIL, W * px - w / 2, H * 0.28, w, H * 0.42);
      });
      // mưa sao: rơi xuống trong khung giữa hai dải bụi
      {
        const y0 = H * 0.35,
          y1 = H * 0.62,
          hh = y1 - y0;
        ctx.lineCap = "round";
        for (const r of RAIN) {
          const k = (r.ph + t * r.sp) % 1,
            e = Math.pow(k, 1.2); // rơi tăng tốc nhẹ
          const y = y0 + e * hh,
            x = r.x - (y - y0) * r.tilt; // trôi chéo sang trái
          const env = Math.pow(Math.sin(Math.PI * k), 0.9); // hiện dần - tắt dần
          const a = env * (0.55 + 0.45 * Math.sin(t * 2 + r.tw));
          if (a < 0.02) continue;
          const L = r.len * (0.5 + 0.5 * env),
            tx = x + L * r.tilt,
            ty = y - L;
          const g = ctx.createLinearGradient(tx, ty, x, y);
          g.addColorStop(0, "rgba(200,210,255,0)");
          g.addColorStop(1, "rgba(245,247,255,1)");
          ctx.globalAlpha = a * 0.9;
          ctx.strokeStyle = g;
          ctx.lineWidth = r.sz;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(x, y);
          ctx.stroke();
          const gr = (r.big ? 7 : 4) * r.sz;
          ctx.globalAlpha = a * (r.big ? 0.8 : 0.5);
          ctx.drawImage(glow, x - gr, y - gr, gr * 2, gr * 2); // đầu sao phát sáng
        }
      }
      // hai dải bụi sao: dải xa trôi một chiều, dải gần trôi chiều ngược lại
      const hz = 1 + 0.8 * sm((p - E) / 2); // quầng sương mờ quanh hai dải bụi
      ctx.globalAlpha = 0.4 * hz;
      ctx.drawImage(
        glow,
        -W * 0.15,
        H * 0.295 - H * 0.09,
        W * 1.3,
        H * 0.18,
      );
      ctx.globalAlpha = 0.42 * hz;
      ctx.drawImage(
        glow,
        -W * 0.15,
        H * 0.68 - H * 0.11,
        W * 1.3,
        H * 0.22,
      );
      ctx.globalAlpha = 0.06;
      ctx.drawImage(glow, -W * 0.1, H * 0.3, W * 1.2, H * 0.4);
      for (const b of BAND) {
        const by = b.y * H;
        for (let k = 0; k < 4; k++) {
          ctx.fillStyle = BCOL[k];
          for (let j = 0; j < 8; j++) {
            ctx.globalAlpha =
              0.6 + 0.4 * Math.sin(t * 1.3 + j * 0.785);
            ctx.beginPath();
            for (const q of b.a[k][j]) {
              const x = (((q.x + b.sp * t) % W) + W) % W,
                y =
                  by +
                  q.y +
                  Math.sin(x * 0.004 + q.ph * 0.2 + t * 0.15) *
                  H *
                  0.006;
              ctx.rect(x, y, q.s, q.s);
            }
            ctx.fill();
          }
        }
      }
      // va chạm: q = số giây kể từ lúc tia sáng chạm thiên hà
      let q = -1;
      for (const im of IMP) {
        const d = p - im;
        if (d >= 0 && d < 4.6) q = d;
      }
      const fl = q >= 0 ? Math.exp(-q * 2.2) : 0,
        rEnv = q < 0 ? 0 : sm(q / 0.45) * (1 - sm((q - 1.5) / 1));
      const dz = 1 - sm((p - E - 0.2) / 1.4);
      ctx.globalAlpha =
        (0.5 + 0.1 * Math.sin(t * 0.8) + 0.15 * rEnv) * dz;
      ctx.drawImage(
        glow,
        cx - rx * 1.5,
        cy - rx * 0.22,
        rx * 3,
        rx * 0.44,
      );
      ctx.globalAlpha = Math.min(1, 0.4 + 0.9 * fl + 0.3 * rEnv) * dz;
      ctx.drawImage(
        glow,
        cx - rx * 0.7,
        cy - rx * 0.1,
        rx * 1.4,
        rx * 0.2,
      );
      for (let k = 0; k < 4; k++) {
        ctx.fillStyle = DCOL[k];
        ctx.globalAlpha = 0.85 * dz;
        ctx.beginPath();
        for (const d of DISC[k]) {
          const th = d.t0 + d.w * t;
          ctx.rect(
            cx + Math.cos(th) * d.r,
            cy + Math.sin(th) * d.r * 0.14,
            d.s,
            d.s,
          );
        }
        ctx.fill();
      }
      if (fl > 0.02) {
        ctx.globalAlpha = Math.min(1, fl * 1.3);
        ctx.drawImage(
          glow,
          cx - rx * 0.55,
          cy - rx * 0.1,
          rx * 1.1,
          rx * 0.2,
        );
        if (q < 0.55) {
          const h = H * 0.09 * (1 - q / 0.55),
            g = ctx.createLinearGradient(0, cy, 0, cy - h);
          g.addColorStop(0, "rgba(255,255,255,1)");
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.globalAlpha = 1;
          ctx.strokeStyle = g;
          ctx.lineWidth = 4 * su;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx, cy - h);
          ctx.stroke();
        }
      }
      if (rEnv > 0.01) {
        // 5 vòng tròn đồng tâm sáng chạy xoắn
        for (let i = 0; i < 6; i++) {
          const r = rx * 1.05 * (0.18 + 0.17 * i),
            ra = rEnv * (1 - 0.1 * i);
          ctx.strokeStyle = "#d4dcff";
          ctx.beginPath();
          ctx.ellipse(cx, cy, r, r * 0.15, 0, 0, 6.3);
          ctx.globalAlpha = ra * 0.08;
          ctx.lineWidth = 10 * su;
          ctx.stroke();
          ctx.globalAlpha = ra * 0.2;
          ctx.lineWidth = 4.5 * su;
          ctx.stroke();
          ctx.globalAlpha = ra * 0.75;
          ctx.lineWidth = 1.6 * su;
          ctx.stroke();
        }
      }
      if (q >= 0.9 && q < 4.4) {
        // vòng mảnh lan rộng ra ngoài
        const r = rx * (1 + (q - 0.9)),
          a = 0.5 * sm((q - 0.9) / 0.5) * (1 - sm((q - 3) / 1.4));
        ctx.strokeStyle = "#a9b3e8";
        ctx.beginPath();
        ctx.ellipse(cx, cy, r, r * 0.15, 0, 0, 6.3);
        ctx.globalAlpha = a * 0.16;
        ctx.lineWidth = 22 * su;
        ctx.stroke();
        ctx.globalAlpha = a * 0.3;
        ctx.lineWidth = 10 * su;
        ctx.stroke();
        ctx.globalAlpha = a * 0.32;
        ctx.lineWidth = 1.8 * su;
        ctx.stroke();
        ctx.fillStyle = "#dfe5ff";
        for (let j = 0; j < 500; j++) {
          const an = (j / 500) * 6.283 + t * 0.05,
            rr = r + Math.sin(j * 7.3) * 9 * su;
          ctx.globalAlpha =
            a * (0.4 + 0.6 * Math.abs(Math.sin(j * 12.9)));
          ctx.fillRect(
            cx + Math.cos(an) * rr,
            cy + Math.sin(an) * rr * 0.15,
            1.5 * su,
            1.5 * su,
          );
        }
      }
      // tia sáng nhỏ rơi từ trên xuống thiên hà (tăng tốc nhẹ)
      for (const s0 of BEAM) {
        const k = (p - s0) / 1.4;
        if (k < 0 || k > 1) continue;
        const y = H * (0.22 + 0.54 * Math.pow(k, 1.25)),
          len = H * 0.05,
          g = ctx.createLinearGradient(0, y - len, 0, y);
        g.addColorStop(0, "rgba(220,228,255,0)");
        g.addColorStop(1, "rgba(255,255,255,1)");
        ctx.globalAlpha = 1;
        ctx.strokeStyle = g;
        ctx.lineWidth = 3 * su;
        ctx.beginPath();
        ctx.moveTo(cx, y - len);
        ctx.lineTo(cx, y);
        ctx.stroke();
        const r = 12 * su;
        ctx.globalAlpha = 0.9;
        ctx.drawImage(glow, cx - r, y - r, r * 2, r * 2);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = "source-over"; // tối dần cuối vòng, sáng dần đầu vòng
      const fade = Math.max(cl((p - E - 1.45) / 0.85), cl(1 - p / 0.35));
      if (fade > 0) {
        ctx.globalAlpha = fade;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
      }
      if (txt) drawText(ctx, p);
    }

    /* ===== VẼ CHỮ LÊN CANVAS (chỉ dùng khi xuất video) ===== */
    const SERIF = "'Cormorant Garamond',serif",
      SCRIPT = "'Pinyon Script',cursive";
    const MONO = {
      top: 52,
      lh: 80,
      fs: 76,
      fam: SCRIPT,
      wt: 400,
      kind: "mono",
      col: "#eef0fa",
      sh: [18, "rgba(200,210,255,.4)"],
    };
    const SPEC = {
      mono: MONO,
      mono2: { ...MONO, top: 74 },
      sd: {
        top: 200,
        lh: 20,
        fs: 15,
        fam: SERIF,
        wt: 500,
        ls: 0.58,
        ind: 1,
        col: "#c4c9e2",
        txt: "SAVE THE DATE",
      },
      names: {
        top: 248,
        lh: 68,
        fs: 52,
        fam: SCRIPT,
        wt: 400,
        kind: "names",
        col: "#eef0fa",
        sh: [14, "rgba(200,210,255,.3)"],
      },
      date: {
        top: 339,
        lh: 26,
        fs: 19,
        fam: SERIF,
        wt: 500,
        ls: 0.1,
        col: "#d6d9ec",
        txt: "25.10.2026",
      },
      love: {
        top: 260,
        lh: 20,
        fs: 15,
        fam: SERIF,
        wt: 500,
        ls: 0.53,
        ind: 1,
        col: "#c4c9e2",
        txt: "TRUE LOVE IS ETERNAL, INFINITE, AND ALWAYS LIKE ITSELF.",
      },
      hearts: {
        top: 304,
        lh: 20,
        fs: 13,
        fam: "serif",
        wt: 400,
        ls: 1.1,
        ind: 1,
        col: "#b9bfe0",
        txt: "♥♥♥",
      },
    };
    function tv(w, p) {
      // độ hiện 0..1 của chữ, mô phỏng transition 1.3s của bản xem trước
      const a = w[0],
        b = w[1];
      if (p < a) return 0;
      if (p < b) return sm((p - a) / 1.3);
      return sm((b - a) / 1.3) * (1 - sm((p - b) / 1.3));
    }
    function drawText(ctx, p) {
      const k = dpr * u;
      for (const [e, w] of TXT) {
        const v = tv(w, p);
        if (v < 0.003) continue;
        const sp = SPEC[e.id];
        ctx.save();
        ctx.setTransform(
          k,
          0,
          0,
          k,
          (dpr * (W - 1024 * u)) / 2,
          (dpr * (H - 576 * u)) / 2,
        );
        ctx.globalAlpha = v;
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = sp.col;
        const bl = v < 0.98,
          OFF = 30000; // đang mờ: chỉ vẽ cái bóng đã làm mờ (nhanh hơn ctx.filter rất nhiều)
        if (bl) ctx.shadowBlur = 20 * (1 - v) * k;
        else if (sp.sh) {
          ctx.shadowBlur = sp.sh[0] * k;
          ctx.shadowColor = sp.sh[1];
        }
        const ft = (tx, x, y, c) => {
          if (bl) {
            ctx.shadowColor = c || sp.col;
            ctx.shadowOffsetX = OFF;
            ctx.fillText(tx, x - OFF / k, y);
          } else ctx.fillText(tx, x, y);
        };
        ctx.font = `${sp.wt} ${sp.fs}px ${sp.fam}`;
        const m = ctx.measureText("Hg"),
          y =
            sp.top +
            (sp.lh -
              (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) /
            2 +
            m.fontBoundingBoxAscent +
            6 * (1 - v);
        if (sp.kind === "mono") {
          ctx.letterSpacing = "0px";
          const l1 = (window.__bgData && window.__bgData.init1) || "A";
          const l2 = (window.__bgData && window.__bgData.init2) || "H";
          const wA = ctx.measureText(l1).width,
            wH = ctx.measureText(l2).width,
            x0 = (1024 - (wA + wH - 0.3 * sp.fs)) / 2;
          ft(l1, x0, y);
          ft(l2, x0 + wA - 0.3 * sp.fs, y + 18);
        } else if (sp.kind === "names") {
          ctx.letterSpacing = 0.03 * 52 + "px";
          ctx.wordSpacing = 0.42 * 52 + "px";
          const gName = ((window.__bgData && window.__bgData.groom) || "Quốc Anh") + " ";
          const bName = " " + ((window.__bgData && window.__bgData.bride) || "Kiều Hân");
          const P = [
            [gName, 52, sp.col],
            ["&", 26, "#b9bfe0"],
            [bName, 52, sp.col],
          ];
          let tot = 0;
          for (const q of P) {
            ctx.font = `400 ${q[1]}px ${SCRIPT}`;
            q.w = ctx.measureText(q[0]).width;
            tot += q.w;
          }
          let x = (1024 - tot) / 2;
          for (const q of P) {
            ctx.font = `400 ${q[1]}px ${SCRIPT}`;
            ctx.fillStyle = q[2];
            ft(q[0], x, y, q[2]);
            x += q.w;
          }
        } else {
          const ls = sp.ls * sp.fs,
            n = [...sp.txt].length;
          ctx.letterSpacing = "0px";
          const w0 = ctx.measureText(sp.txt).width,
            vis = sp.ind ? w0 + ls * (n - 1) : w0 + ls * n;
          ctx.letterSpacing = ls + "px";
          ft(sp.txt, (1024 - vis) / 2, y);
        }
        ctx.restore();
      }
    }

    /* ===== XUẤT VIDEO MP4 (H.264) – render từng khung hình, không giật dù máy yếu ===== */
    const $ = (id) => document.getElementById(id),
      sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let CANCEL = false;
    const LV = ["28", "2A", "32", "33", "34"],
      LT = [62.9e6, 133.5e6, 150.9e6, 251.6e6, 530e6]; // level H.264 theo số pixel/giây
    async function pickCodec(w, h, fps, bitrate) {
      const pr = w * h * fps;
      let i = LT.findIndex((x) => pr <= x);
      if (i < 0) i = 4;
      for (; i < LV.length; i++)
        for (const hw of ["prefer-hardware", "no-preference"]) {
          // ưu tiên chip đồ hoạ (GPU) để mã hoá nhanh
          const cfg = {
            codec: "avc1.6400" + LV[i],
            width: w,
            height: h,
            bitrate,
            framerate: fps,
            avc: { format: "avc" },
            latencyMode: "realtime",
            hardwareAcceleration: hw,
          };
          try {
            const r = await VideoEncoder.isConfigSupported(cfg);
            if (r.supported) return cfg;
          } catch (e) { }
        }
      return null;
    }
    const yieldUI = () =>
      new Promise((r) => {
        const c = new MessageChannel();
        c.port1.onmessage = () => r();
        c.port2.postMessage(0);
      });
    function setMsg(m) {
      const msgEl = $("xmsg");
      if (msgEl) msgEl.textContent = m;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "EXPORT_STATUS", message: m }, "*");
      }
    }
    async function exportVideo() {
      if (EXPORTING) return;
      if (!("VideoEncoder" in window)) {
        setMsg(
          "Trình duyệt chưa hỗ trợ. Hãy dùng Chrome hoặc Edge bản mới.",
        );
        return;
      }
      const [ow, oh] = $("xres").value.split("x").map(Number),
        fps = +$("xfps").value,
        loops = +$("xloop").value;
      const scale = ow / 1920,
        total = Math.round(CYCLE * loops * fps),
        tag = oh >= 2160 ? "4k" : oh + "p";
      EXPORTING = true;
      CANCEL = false;
      $("xgo").disabled = true;
      $("xcancel").style.display = "";
      $("xbar").style.display = "block";
      const bar = $("xbar").firstElementChild;
      let encErr = null,
        enc = null;
      try {
        setMsg("Đang tải font…");
        await Promise.all([
          document.fonts.load("400 52px 'Pinyon Script'"),
          document.fonts.load("500 15px 'Cormorant Garamond'"),
          document.fonts.ready,
        ]);
        W = 1920;
        H = 1080;
        dpr = scale;
        layout(); // dựng cảnh 16:9 chuẩn TV, phóng theo độ phân giải
        const ex = document.createElement("canvas");
        ex.width = ow;
        ex.height = oh;
        const x2 = ex.getContext("2d", { alpha: false });
        const bitrate = Math.min(60e6, Math.round(ow * oh * fps * 0.15));
        const cfg = await pickCodec(ow, oh, fps, bitrate);
        if (!cfg)
          throw new Error(
            "Máy không mã hoá được độ phân giải này. Thử chọn thấp hơn (2K hoặc Full HD).",
          );
        const mux = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: "avc", width: ow, height: oh },
          fastStart: "in-memory",
        });
        enc = new VideoEncoder({
          output: (c, m) => mux.addVideoChunk(c, m),
          error: (e) => {
            encErr = e;
          },
        });
        enc.configure(cfg);
        const t0 = performance.now();
        let tr = 0,
          te = 0;
        for (let i = 0; i < total; i++) {
          if (CANCEL) throw new Error("Đã huỷ.");
          if (encErr) throw encErr;
          let a0 = performance.now();
          while (enc.encodeQueueSize > 8) await sleep(1);
          te += performance.now() - a0;
          a0 = performance.now();
          render(x2, i / fps, true);
          tr += performance.now() - a0;
          a0 = performance.now();
          const f = new VideoFrame(ex, {
            timestamp: Math.round((i * 1e6) / fps),
            duration: Math.round(1e6 / fps),
          });
          enc.encode(f, { keyFrame: i % (fps * 2) === 0 });
          f.close();
          te += performance.now() - a0;
          if (i % 4 === 0) {
            const pc = (i + 1) / total,
              el = (performance.now() - t0) / 1000;
            bar.style.width = pc * 100 + "%";
            setMsg(
              `Đang render ${Math.round(pc * 100)}% · còn ~${Math.max(0, Math.round(el / pc - el))}s · vẽ ${Math.round(tr / (i + 1))}ms + mã hoá ${Math.round(te / (i + 1))}ms /khung`,
            );
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: "EXPORT_PROGRESS",
                progress: Math.round(pc * 100),
                message: `Đang kết xuất video 4K... ${Math.round(pc * 100)}%`,
              }, "*");
            }
            await yieldUI();
          }
        }
        setMsg("Đang đóng gói MP4…");
        await enc.flush();
        mux.finalize();
        const url = URL.createObjectURL(
          new Blob([mux.target.buffer], { type: "video/mp4" }),
        );
        const a = document.createElement("a");
        a.href = url;
        a.download = `save-the-date-${tag}-${fps}fps.mp4`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        bar.style.width = "100%";
        setMsg("Xong! File MP4 đã được tải về.");
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "EXPORT_FINISHED" }, "*");
        }
      } catch (err) {
        const errMsg = err && err.message ? err.message : String(err);
        setMsg(errMsg);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "EXPORT_ERROR", message: errMsg }, "*");
        }
      } finally {
        try {
          enc && enc.state !== "closed" && enc.close();
        } catch (e) { }
        resize();
        EXPORTING = false;
        $("xgo").disabled = false;
        $("xcancel").style.display = "none";
      }
    }
    $("xgo").onclick = exportVideo;
    $("xcancel").onclick = () => {
      CANCEL = true;
    };
    $("xtoggle").onclick = () => $("ui").classList.toggle("open");
    
    // Kiểm tra nếu đang nằm trong màn hình chỉnh sửa hoặc iframe thì ẩn hoàn toàn nút xuất video
    try {
      const isEmbedded = window.parent && window.parent !== window;
      const hideExportParam = new URLSearchParams(window.location.search).get("hideExport") === "1" || isEmbedded;
      if (hideExportParam) {
        document.body.classList.add("hide-export");
        const ui = document.getElementById("ui");
        if (ui) ui.classList.add("hide-export");
      }
    } catch (e) { }

    let uiT;
    const showUI = () => {
      if (document.body.classList.contains("hide-export")) return;
      const ui = $("ui");
      if (!ui) return;
      ui.classList.add("show");
      clearTimeout(uiT);
      uiT = setTimeout(() => ui.classList.remove("show"), 3000);
    };
    ["mousemove", "pointerdown", "touchstart", "keydown"].forEach((ev) =>
      addEventListener(ev, showUI, { passive: true }),
    );
    addEventListener("resize", () => {
      if (!EXPORTING) resize();
    });
    resize();
    requestAnimationFrame(frame);

    /* ===== CẦU NỐI ĐỒNG BỘ DỮ LIỆU ĐỘNG (BACKGROUND BRIDGE) ===== */
    function applyData(d) {
      if (!d) return;
      window.__bgData = window.__bgData || {};
      const groom = d.groomName || d.groom || "Quốc Anh";
      const bride = d.brideName || d.bride || "Kiều Hân";
      const date = d.weddingDate || d.date || "25.10.2026";
      let init1 = d.initial1 || d.init1 || "";
      let init2 = d.initial2 || d.init2 || "";
      if (!init1 && groom) init1 = groom.trim().charAt(0).toUpperCase();
      if (!init2 && bride) init2 = bride.trim().charAt(0).toUpperCase();
      if (!init1) init1 = "A";
      if (!init2) init2 = "H";
      const title = d.title || "SAVE THE DATE";
      const slogan = d.slogan || "TRUE LOVE IS ETERNAL, INFINITE, AND ALWAYS LIKE ITSELF.";

      window.__bgData = { groom, bride, date, init1, init2, title, slogan };

      const m1 = document.getElementById("mono");
      const m2 = document.getElementById("mono2");
      const nm = document.getElementById("names");
      const dt = document.getElementById("date");
      const sd = document.getElementById("sd");
      const lv = document.getElementById("love");

      // Cập nhật Style & Vị trí Tên
      if (nm) {
        nm.innerHTML = `${groom} <s>&amp;</s> ${bride}`;
        if (d.namesFontSize) nm.style.fontSize = `${d.namesFontSize}px`;
        if (d.namesFontFamily) nm.style.fontFamily = d.namesFontFamily;
        if (d.namesColor) nm.style.color = d.namesColor;
        if (d.namesPosY !== undefined && d.namesPosY !== "") nm.style.top = `${d.namesPosY}px`;
        if (d.namesPosX !== undefined && d.namesPosX !== "") {
          nm.style.transform = `translateX(${d.namesPosX}px)`;
        } else {
          nm.style.transform = "";
        }
      }

      // Cập nhật Style & Vị trí Logo (Monogram)
      [m1, m2].forEach((m, idx) => {
        if (!m) return;
        m.innerHTML = `${init1}<span>${init2}</span>`;
        if (d.monoFontSize) {
          m.style.fontSize = `${d.monoFontSize}px`;
          m.style.lineHeight = `${Number(d.monoFontSize) + 4}px`;
        }
        if (d.monoFontFamily) m.style.fontFamily = d.monoFontFamily;
        if (d.monoColor) m.style.color = d.monoColor;
        if (d.monoPosY !== undefined && d.monoPosY !== "") {
          m.style.top = `${Number(d.monoPosY) + (idx === 1 ? 22 : 0)}px`;
        }
        if (d.monoPosX !== undefined && d.monoPosX !== "") {
          m.style.transform = `translateX(${d.monoPosX}px)`;
        } else {
          m.style.transform = "";
        }
      });

      // Cập nhật Style & Vị trí Ngày cưới
      if (dt) {
        dt.textContent = date;
        if (d.dateFontSize) dt.style.fontSize = `${d.dateFontSize}px`;
        if (d.dateFontFamily) dt.style.fontFamily = d.dateFontFamily;
        if (d.dateColor) dt.style.color = d.dateColor;
        if (d.datePosY !== undefined && d.datePosY !== "") dt.style.top = `${d.datePosY}px`;
        if (d.datePosX !== undefined && d.datePosX !== "") {
          dt.style.transform = `translateX(${d.datePosX}px)`;
        } else {
          dt.style.transform = "";
        }
      }

      // Cập nhật Style & Vị trí Tiêu đề
      if (sd) {
        sd.textContent = title;
        if (d.titleFontSize) sd.style.fontSize = `${d.titleFontSize}px`;
        if (d.titleFontFamily) sd.style.fontFamily = d.titleFontFamily;
        if (d.titleColor) sd.style.color = d.titleColor;
        if (d.titlePosY !== undefined && d.titlePosY !== "") sd.style.top = `${d.titlePosY}px`;
        if (d.titlePosX !== undefined && d.titlePosX !== "") {
          sd.style.transform = `translateX(${d.titlePosX}px)`;
        } else {
          sd.style.transform = "";
        }
      }

      if (lv) lv.textContent = slogan;

      // Cập nhật SPEC xuất video MP4
      if (typeof SPEC !== "undefined") {
        if (SPEC.sd) {
          SPEC.sd.txt = title;
          if (d.titleFontSize) SPEC.sd.fs = Number(d.titleFontSize);
          if (d.titleFontFamily) SPEC.sd.fam = d.titleFontFamily;
          if (d.titleColor) SPEC.sd.col = d.titleColor;
          if (d.titlePosY) SPEC.sd.top = Number(d.titlePosY);
        }
        if (SPEC.date) {
          SPEC.date.txt = date;
          if (d.dateFontSize) SPEC.date.fs = Number(d.dateFontSize);
          if (d.dateFontFamily) SPEC.date.fam = d.dateFontFamily;
          if (d.dateColor) SPEC.date.col = d.dateColor;
          if (d.datePosY) SPEC.date.top = Number(d.datePosY);
        }
        if (SPEC.love) SPEC.love.txt = slogan;
        if (SPEC.names) {
          if (d.namesFontSize) SPEC.names.fs = Number(d.namesFontSize);
          if (d.namesFontFamily) SPEC.names.fam = d.namesFontFamily;
          if (d.namesColor) SPEC.names.col = d.namesColor;
          if (d.namesPosY) SPEC.names.top = Number(d.namesPosY);
        }
        if (SPEC.mono) {
          if (d.monoFontSize) SPEC.mono.fs = Number(d.monoFontSize);
          if (d.monoFontFamily) SPEC.mono.fam = d.monoFontFamily;
          if (d.monoColor) SPEC.mono.col = d.monoColor;
          if (d.monoPosY) SPEC.mono.top = Number(d.monoPosY);
        }
      }
    }

    // Đọc URL Search Params nếu có
    try {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("groom") || urlParams.has("bride") || urlParams.has("date") || urlParams.has("init1") || urlParams.has("init2") || urlParams.has("title")) {
        applyData({
          groomName: urlParams.get("groom") || undefined,
          brideName: urlParams.get("bride") || undefined,
          weddingDate: urlParams.get("date") || undefined,
          initial1: urlParams.get("init1") || undefined,
          initial2: urlParams.get("init2") || undefined,
          title: urlParams.get("title") || undefined,
          slogan: urlParams.get("slogan") || undefined,
        });
      }
    } catch (e) {
      console.warn("Could not parse URL params", e);
    }

    // Lắng nghe message từ trình chỉnh sửa hoặc trang cha
    window.addEventListener("message", (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "UPDATE_BACKGROUND_DATA" || e.data.type === "UPDATE_WEDDING_DATA") {
        applyData(e.data.payload);
      }
      if (e.data.type === "RESTART_ANIMATION") {
        T0 = performance.now();
      }
      if (e.data.type === "TRIGGER_EXPORT_VIDEO") {
        const payload = e.data.payload || {};
        if (payload.res && $("xres")) $("xres").value = payload.res;
        if (payload.fps && $("xfps")) $("xfps").value = String(payload.fps);
        if (payload.loop && $("xloop")) $("xloop").value = String(payload.loop);
        exportVideo();
      }
    });

    // Thông báo cho trang cha biết iframe đã sẵn sàng
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "BACKGROUND_READY" }, "*");
    }
  </script>
</body>

</html>
